# Temporary HTTP-only certificate bootstrap. No missing certificate references.
# Remove this enabled file when nginx-marketing.conf is installed.
server {
  listen 80;
  listen [::]:80;
  server_name smedatacenter.xyz www.smedatacenter.xyz;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/smedc-acme;
    try_files $uri =404;
  }
  location / { return 404; }
}
