# Enable only after the root/www certificate and the first versioned artifact exist.
# This is a separate virtual host; nginx-smedc.conf continues to own the API.
server {
  listen 80;
  listen [::]:80;
  server_name smedatacenter.xyz www.smedatacenter.xyz;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/smedc-acme;
    try_files $uri =404;
  }
  location / {
    return 301 https://smedatacenter.xyz$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name www.smedatacenter.xyz;
  ssl_certificate /etc/letsencrypt/live/smedatacenter.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/smedatacenter.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  return 301 https://smedatacenter.xyz$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name smedatacenter.xyz;
  ssl_certificate /etc/letsencrypt/live/smedatacenter.xyz/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/smedatacenter.xyz/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  root /opt/smedc/marketing/current;
  autoindex off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; frame-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  add_header Cache-Control "no-cache";

  location = / {
    try_files /index.html =404;
  }
  location = /styles.css { try_files $uri =404; }
  location = /client.js { try_files $uri =404; }
  location = /version.json { try_files $uri =404; }
  location ~ ^/assets/[a-z-]+\.(webp|png|svg)$ { try_files $uri =404; }
  # Only this public, anonymized sample may be embedded by the same-site reader.
  location = /samples/weekly-report.html {
    try_files $uri =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache";
  }
  location = /samples/weekly-report.css { try_files $uri =404; }
  location = /samples/weekly-report.js { try_files $uri =404; }
  # No SPA fallback: business/auth/health routes are never served marketing HTML.
  location / { return 404; }
}
